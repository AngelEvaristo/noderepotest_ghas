apiVersion: v1
kind: Namespace
metadata:
  name: noderepo-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noderepo-test-deployment
  namespace: noderepo-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: noderepo-test-deployment
  template:
    metadata:
      labels:
        app: noderepo-test-deployment
    spec:
      containers:
        - name: angular-click-app
          image: tecylabtest.azurecr.io/angular-app:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: noderepo-test-service
  namespace: noderepo-test
spec:
  type: LoadBalancer
  selector:
    app: noderepo-test-deployment
  ports:
    - protocol : TCP
      port: 80
      targetPort: 80      